name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub Stats SVG
        run: |
          mkdir -p assets
          curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors \
            -o assets/github-stats.svg \
            "https://github-readme-stats.vercel.app/api?username=lynx009&show_icons=true&theme=default&hide_border=true&count_private=true&icon_color=F59E0B&title_color=6366F1&text_color=64748B&bg_color=ffffff"

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg
          git diff --staged --quiet || git commit -m "chore: update github stats"
          git push
